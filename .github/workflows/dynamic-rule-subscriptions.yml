name: Dynamic rule subscriptions optimization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dynamic-rule-subscriptions.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dynamic subscriptions
        run: python .github/scripts/patch_dynamic_subscriptions.py

      - name: Commit source optimization back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/src/main/java/com/aoe/canbusmonitor/FytBridge.kt example/src/main/java/com/aoe/canbusmonitor/TurnSignalService.kt example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt example/build.gradle
          git commit -m "Optimize FYT subscriptions for rule-only background mode"
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          touch github.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-v1.6.2-dynamic-subscriptions-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error
