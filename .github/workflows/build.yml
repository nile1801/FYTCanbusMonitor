name: Build APK

on:
  push:
    branches:
      - main
      - turn-sound
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned-and-debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # fytcanbusmonitor/build.gradle reads this file during Gradle configuration.
      # No package credentials are required for a local APK build.
      - name: Create github.properties
        run: |
          touch github.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        run: ./gradlew :example:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned release APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-release-unsigned-apk
          path: example/build/outputs/apk/release/*.apk
          if-no-files-found: error
