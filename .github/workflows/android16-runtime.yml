name: Android Runtime Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: android-${{ matrix.api-level }}-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create github.properties
        run: touch github.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :example:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API ${{ matrix.api-level }} launch + logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r example/build/outputs/apk/debug/example-debug.apk
            adb shell pm grant com.aoe.canbusmonitor.turnsound android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n com.aoe.canbusmonitor.turnsound/com.aoe.canbusmonitor.MainActivity
            sleep 8
            echo '===== PROCESS ====='
            adb shell pidof com.aoe.canbusmonitor.turnsound
            echo '===== CRASH LOG ====='
            adb logcat -d -v threadtime | grep -E -A 100 -B 30 'FATAL EXCEPTION|Process: com.aoe.canbusmonitor.turnsound' || true
            ! adb logcat -d -v threadtime | grep -q 'Process: com.aoe.canbusmonitor.turnsound'
            echo '===== ACTIVITY STATE ====='
            adb shell dumpsys activity activities | grep -A 25 -B 8 'com.aoe.canbusmonitor.turnsound' || true
