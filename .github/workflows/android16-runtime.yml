name: Android 16 Runtime Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android16-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create github.properties
        run: touch github.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :example:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 launch + logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r example/build/outputs/apk/debug/example-debug.apk
            adb logcat -c
            adb shell am start -W -n com.aoe.canbusmonitor/.MainActivity || true
            sleep 8
            echo '===== PROCESS ====='
            adb shell pidof com.aoe.canbusmonitor || true
            echo '===== CRASH LOG ====='
            adb logcat -d -v threadtime | grep -E -A 80 -B 20 'FATAL EXCEPTION|AndroidRuntime|Process: com.aoe.canbusmonitor' || true
            echo '===== ACTIVITY STATE ====='
            adb shell dumpsys activity activities | grep -A 20 -B 5 'com.aoe.canbusmonitor' || true
            if adb logcat -d | grep -q 'FATAL EXCEPTION.*'; then
              exit 1
            fi
