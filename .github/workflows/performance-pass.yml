name: Performance optimization pass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/performance-pass.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance patch
        run: python .github/scripts/patch_performance_pass.py

      - name: Commit optimized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize background performance state visibility"
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          touch github.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-v1.6.4-performance-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# final touch-up trigger
