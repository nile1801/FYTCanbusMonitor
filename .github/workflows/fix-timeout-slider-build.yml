name: Fix timeout slider compile and build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-timeout-slider-build.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix timeout SeekBar callback scope
        shell: python
        run: |
          from pathlib import Path
          path = Path('example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = 'val value = timeoutSeek.progress * SettingsStore.TIMEOUT_STEP_MS'
          new = 'val value = (seekBar?.progress ?: 0) * SettingsStore.TIMEOUT_STEP_MS'
          if new in text:
              print('Fix already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Patched MainActivity.kt')
          else:
              raise SystemExit('Expected timeout slider line not found')

      - name: Commit source fix back to main
        shell: bash
        run: |
          if git diff --quiet -- example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt; then
            echo "No source change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt
            git commit -m "Fix timeout slider callback compilation"
            git push origin HEAD:main
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          touch github.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-v1.6-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error
