name: Fix rule dialog scroll and build APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-rule-dialog-12in.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch rule dialog for 12.3-inch landscape screens
        shell: python
        run: |
          from pathlib import Path

          path = Path('example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          old = '''        val dialog = AlertDialog.Builder(this)
              .setTitle(if (existing == null) "Thêm trigger FYT" else "Sửa trigger FYT")
              .setView(root)
              .setNegativeButton("HỦY", null)
              .setPositiveButton("LƯU", null)
              .create()
          '''

          new = '''        val scroll = ScrollView(this).apply {
              isFillViewport = true
              overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
          }
          scroll.addView(
              root,
              ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.WRAP_CONTENT
              )
          )

          val dialog = AlertDialog.Builder(this)
              .setTitle(if (existing == null) "Thêm trigger FYT" else "Sửa trigger FYT")
              .setView(scroll)
              .setNegativeButton("HỦY", null)
              .setPositiveButton("LƯU", null)
              .create()
          '''

          if old not in text:
              if '.setTitle(if (existing == null) "Thêm trigger FYT" else "Sửa trigger FYT")\n            .setView(scroll)' in text:
                  print('Patch already present')
              else:
                  raise SystemExit('Target dialog block not found; refusing to patch the wrong dialog')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Patched MainActivity.kt')

      - name: Commit source fix back to main
        shell: bash
        run: |
          if git diff --quiet -- example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt
          git commit -m "Fix rule dialog scrolling on 12.3-inch displays"
          git push origin HEAD:main || echo "Warning: source push failed; APK will still be built from the patched working tree"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local build properties
        run: |
          touch github.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-scroll-fix-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error
