name: Fix persistent rule storage permission

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-persistent-storage-permission.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch persistent storage permission flow
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('example/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n'
          if 'android.permission.MANAGE_EXTERNAL_STORAGE' not in text:
              marker = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              if marker not in text:
                  raise SystemExit('Manifest permission marker not found')
              text = text.replace(marker, marker + permission, 1)
              manifest.write_text(text, encoding='utf-8')

          gradle = Path('example/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 10', 'versionCode 11', 1)
          text = text.replace('versionName "1.6.0-persistent-rules-multi-filter"', 'versionName "1.6.1-persistent-storage-permission"', 1)
          gradle.write_text(text, encoding='utf-8')

          main = Path('example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt')
          text = main.read_text(encoding='utf-8')

          if 'import android.net.Uri\n' not in text:
              text = text.replace('import android.graphics.Typeface\n', 'import android.graphics.Typeface\nimport android.net.Uri\n', 1)
          if 'import android.os.Environment\n' not in text:
              text = text.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.os.Environment\n', 1)
          if 'import android.provider.Settings\n' not in text:
              text = text.replace('import android.provider.MediaStore\n', 'import android.provider.MediaStore\nimport android.provider.Settings\n', 1)

          if 'private lateinit var storageAccessStatusText: TextView' not in text:
              marker = '    private lateinit var filterStatusText: TextView\n'
              if marker not in text:
                  raise SystemExit('filterStatusText marker not found')
              text = text.replace(marker, marker + '    private lateinit var storageAccessStatusText: TextView\n', 1)

          if 'private var storagePermissionDialogShown = false' not in text:
              marker = '    private var selectedTabIndex = 0\n'
              if marker not in text:
                  raise SystemExit('selectedTabIndex marker not found')
              text = text.replace(
                  marker,
                  marker + '    private var storagePermissionDialogShown = false\n    private var storageAccessWasGranted = false\n',
                  1
              )

          if 'storageAccessWasGranted = hasPersistentStorageAccess()' not in text:
              marker = '        super.onCreate(savedInstanceState)\n\n'
              if marker not in text:
                  raise SystemExit('onCreate marker not found')
              text = text.replace(marker, marker + '        storageAccessWasGranted = hasPersistentStorageAccess()\n\n', 1)

          old_handler = '        handler.post { requestNotificationPermissionIfNeeded() }'
          new_handler = '''        handler.post {
            if (!requestPersistentStoragePermissionIfNeeded()) {
                requestNotificationPermissionIfNeeded()
            }
        }'''
          if old_handler in text:
              text = text.replace(old_handler, new_handler, 1)

          resume_marker = '''    override fun onResume() {
        super.onResume()
        MonitorCaptureState.enabled = selectedTabIndex == 0 && !monitorPaused'''
          resume_replacement = '''    override fun onResume() {
        super.onResume()

        val hasStorageAccess = hasPersistentStorageAccess()
        if (hasStorageAccess && !storageAccessWasGranted) {
            val restoredRules = RuleStore.load(this)
            renderRules()
            sendServiceAction(TurnSignalService.ACTION_REFRESH)
            if (restoredRules.isNotEmpty()) {
                toast("Đã đọc lại ${restoredRules.size} rule sau khi cấp quyền backup")
            }
        }
        storageAccessWasGranted = hasStorageAccess
        refreshStorageAccessStatus()
        if (storagePermissionDialogShown) requestNotificationPermissionIfNeeded()

        MonitorCaptureState.enabled = selectedTabIndex == 0 && !monitorPaused'''
          if resume_marker in text and 'val hasStorageAccess = hasPersistentStorageAccess()' not in text:
              text = text.replace(resume_marker, resume_replacement, 1)

          old_backup = '''        root.addView(TextView(this).apply {
            text = "Backup rule tự động: ${RuleBackupStore.DISPLAY_PATH}. File nằm ngoài vùng dữ liệu riêng của app; khi cài lại app sẽ thử tìm và restore từng rule đọc được."
            setPadding(0, 0, 0, dp(10))
        })'''
          new_backup = '''        storageAccessStatusText = TextView(this).apply {
            setPadding(0, 0, 0, dp(6))
        }
        root.addView(storageAccessStatusText)
        root.addView(Button(this).apply {
            text = "CẤP / KIỂM TRA QUYỀN BACKUP FILE"
            setOnClickListener { openAllFilesAccessSettings() }
        })
        root.addView(TextView(this).apply {
            text = "Backup rule: ${RuleBackupStore.DISPLAY_PATH}. Muốn tự restore sau khi uninstall/cài lại, Android 11+ cần bật quyền Quản lý tất cả tệp cho app."
            setPadding(0, dp(4), 0, dp(10))
        })
        refreshStorageAccessStatus()'''
          if old_backup in text:
              text = text.replace(old_backup, new_backup, 1)

          permission_methods = '''
    private fun hasPersistentStorageAccess(): Boolean {
        return Build.VERSION.SDK_INT < Build.VERSION_CODES.R || Environment.isExternalStorageManager()
    }

    /**
     * Android 11+ dùng special app access, không có runtime Allow/Deny dialog kiểu permission thường.
     * Lần cài mới sẽ giải thích rồi đưa user tới đúng trang bật "Allow access to manage all files".
     */
    private fun requestPersistentStoragePermissionIfNeeded(): Boolean {
        if (hasPersistentStorageAccess() || storagePermissionDialogShown) return false
        storagePermissionDialogShown = true
        AlertDialog.Builder(this)
            .setTitle("Cấp quyền lưu/restore rule")
            .setMessage(
                "Để rules.json vẫn đọc được sau khi uninstall rồi cài lại, app cần quyền Quản lý tất cả tệp. " +
                    "Android sẽ mở trang Special app access; hãy bật Allow access to manage all files cho FYT Turn Sound."
            )
            .setNegativeButton("ĐỂ SAU") { _, _ -> requestNotificationPermissionIfNeeded() }
            .setPositiveButton("CẤP QUYỀN") { _, _ -> openAllFilesAccessSettings() }
            .show()
        return true
    }

    private fun openAllFilesAccessSettings() {
        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return
        val packageUri = Uri.parse("package:$packageName")
        val intents = arrayOf(
            Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, packageUri),
            Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION),
            Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, packageUri)
        )
        for (intent in intents) {
            try {
                startActivity(intent)
                return
            } catch (_: Throwable) {
            }
        }
        toast("Không mở được màn cấp quyền lưu trữ trên ROM này")
    }

    private fun refreshStorageAccessStatus() {
        if (!::storageAccessStatusText.isInitialized) return
        storageAccessStatusText.text = if (hasPersistentStorageAccess()) {
            "Quyền backup file: ĐÃ CẤP • có thể đọc/ghi trực tiếp ${RuleBackupStore.DISPLAY_PATH}"
        } else {
            "Quyền backup file: CHƯA CẤP • rule vẫn lưu trong app nhưng có thể không restore sau uninstall"
        }
    }

'''
          method_marker = '    private fun requestNotificationPermissionIfNeeded() {'
          if 'private fun hasPersistentStorageAccess()' not in text:
              if method_marker not in text:
                  raise SystemExit('notification permission method marker not found')
              text = text.replace(method_marker, permission_methods + method_marker, 1)

          main.write_text(text, encoding='utf-8')

      - name: Commit source fix back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/src/main/AndroidManifest.xml example/build.gradle example/src/main/java/com/aoe/canbusmonitor/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source change to commit"
          else
            git commit -m "Fix rule backup access across reinstall"
            git push origin HEAD:main
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          touch github.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :example:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyt-turn-sound-v1.6.1-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error
