name: Chẩn đoán dữ liệu âm thanh xi nhan

on:
  push:
    branches: [ new-blinker-audio-vietnamese-ui ]
    paths:
      - '.github/workflows/apply-new-blinker-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn nhánh tạm
        uses: actions/checkout@v4
        with:
          ref: new-blinker-audio-vietnamese-ui

      - name: Kiểm tra từng mảnh Base64
        shell: python
        run: |
          import base64
          import glob
          import hashlib
          import re

          parts = []
          for path in sorted(glob.glob('.tmp-blinker/chunk*.b64')):
              text = open(path, encoding='utf-8').read().replace('\r', '').replace('\n', '')
              bad = ''.join(sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', text))))
              print(f'{path} bytes={len(text)} mod4={len(text) % 4} first={text[:12]} last={text[-12:]} invalid={bad!r}')
              parts.append(text)

          merged = ''.join(parts)
          print(f'TOTAL bytes={len(merged)} mod4={len(merged) % 4}')
          try:
              audio = base64.b64decode(merged, validate=True)
              print(f'DECODED_SIZE={len(audio)}')
              print(f'SHA256={hashlib.sha256(audio).hexdigest()}')
          except Exception as exc:
              print(f'DECODE_ERROR={type(exc).__name__}: {exc}')
          raise SystemExit(1)
