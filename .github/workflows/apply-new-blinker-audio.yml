name: Ghép file âm thanh xi nhan mới

on:
  push:
    branches: [ new-blinker-audio-vietnamese-ui ]
    paths:
      - '.github/workflows/apply-new-blinker-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn nhánh tạm
        uses: actions/checkout@v4
        with:
          ref: new-blinker-audio-vietnamese-ui
          fetch-depth: 0

      - name: Ghép và kiểm tra đúng file MP3 đã tải lên
        shell: bash
        run: |
          cat .tmp-blinker/chunk*.b64 | tr -d '\r\n' | base64 -d > example/src/main/res/raw/turn_signal.mp3
          echo "7dd620192b7cd79aa5cb85014ee50bebdef40402658b0eb84aa8dfa19b658d42  example/src/main/res/raw/turn_signal.mp3" | sha256sum -c -
          test "$(stat -c%s example/src/main/res/raw/turn_signal.mp3)" = "91374"
          rm -rf .tmp-blinker

      - name: Lưu file MP3 chính xác vào nhánh tạm
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Thay âm thanh xi nhan bằng đúng file MP3 mới" || exit 0
          git push origin HEAD:new-blinker-audio-vietnamese-ui
